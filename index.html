<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.75, user-scalable=yes">
  <title>조식 리딩연습 · 플레이팅 카운트</title>
  <style>
    /* ===== 기본 리셋 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      background: #f6f4f1;
      color: #1f2328;
      line-height: 1.6;
      padding: 20px;
    }

    /* ===== 조식 리딩연습 버튼 (하단 고정) ===== */
    .quick-nav {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 8800;
      display: flex;
      align-items: center;
      gap: 7px;
      filter: drop-shadow(0 10px 24px rgba(30, 36, 40, .14));
    }
    .quick-nav-btn {
      appearance: none;
      min-width: 74px;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cfd4d8;
      border-radius: 0;
      background: #fffefa;
      color: #47515a;
      font: 800 12px/1 "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: -.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .quick-nav-btn:hover {
      transform: translateY(-2px);
      border-color: #b8c0c6;
      box-shadow: 0 8px 20px rgba(35, 42, 47, .10);
    }

    /* 조식 리딩연습 버튼 전용 */
    .quick-nav-btn.breakfast-reader {
      min-width: 138px;
      border-radius: 999px;
      border: 1px solid #e5cfd7;
      background: linear-gradient(135deg, #fff0f4 0%, #fff8df 52%, #edf6ef 100%);
      color: #514b50;
      box-shadow: 0 8px 22px rgba(80, 68, 73, .10);
      font-weight: 850;
      padding: 0 16px;
    }
    .quick-nav-btn.breakfast-reader:hover {
      background: linear-gradient(135deg, #ffe9f0 0%, #fff3cd 52%, #e6f2e9 100%);
      border-color: #d9bdc7;
      box-shadow: 0 10px 26px rgba(80, 68, 73, .16);
    }
    .breakfast-reader-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: rgba(255, 255, 255, .78);
      box-shadow: inset 0 0 0 1px rgba(120, 100, 108, .10);
      font-size: 14px;
      line-height: 1;
      flex: 0 0 auto;
    }

    /* ===== 모달 (팝업) ===== */
    .breakfast-modal {
      position: fixed;
      inset: 0;
      z-index: 12000;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(30, 34, 38, .44);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .24s ease, visibility .24s ease;
    }
    .breakfast-modal.is-open {
      opacity: 1;
      visibility: visible;
    }

    .breakfast-dialog {
      width: min(1200px, 97vw);
      height: min(93vh, 980px);
      background: #fffdf9;
      border: 1px solid #d6d3cf;
      border-radius: 22px;
      box-shadow: 0 30px 100px rgba(20, 25, 28, .28);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(18px) scale(.992);
      opacity: 0;
      transition: transform .28s cubic-bezier(.2, .72, .22, 1), opacity .22s ease;
    }
    .breakfast-modal.is-open .breakfast-dialog {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* 모달 헤더 */
    .breakfast-modal-head {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 13px 15px 13px 19px;
      border-bottom: 1px solid #dedbd7;
      background: linear-gradient(115deg, #fff0f4 0%, #fff8df 48%, #edf5ef 100%);
    }
    .breakfast-modal-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .breakfast-modal-badge {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(120, 100, 108, .14);
      font-size: 18px;
      flex: 0 0 auto;
    }
    .breakfast-modal-title b {
      display: block;
      color: #343a37;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: -.025em;
    }
    .breakfast-modal-title small {
      display: block;
      margin-top: 2px;
      color: #7a807c;
      font-size: 10.5px;
      line-height: 1.4;
    }
    .breakfast-close {
      appearance: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(90, 97, 103, .22);
      background: rgba(255, 255, 255, .78);
      color: #5c6260;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
      transition: .16s ease;
    }
    .breakfast-close:hover {
      background: #fff;
      transform: rotate(4deg) scale(1.04);
    }

    /* ===== 모달 본문 (스크롤) ===== */
    .breakfast-modal-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 24px 28px 34px;
      background: #fffdf9;
    }

    /* ===== 플레이팅 카운트 ===== */
    .playing-wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .playing-header {
      font-size: 20px;
      font-weight: 800;
      color: #2d3338;
      letter-spacing: -.03em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .playing-header small {
      font-size: 13px;
      font-weight: 600;
      color: #8a9198;
      letter-spacing: 0;
    }
    .playing-sub {
      color: #6a737b;
      font-size: 13px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eceeef;
    }

    /* 입력 폼 */
    .playing-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
      background: #f8f7f5;
      padding: 20px 24px;
      border: 1px solid #e4e6e7;
      margin-bottom: 24px;
    }
    .playing-form .field {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .playing-form .field label {
      font-size: 13px;
      font-weight: 700;
      color: #4a535b;
      white-space: nowrap;
      min-width: 80px;
    }
    .playing-form .field input[type="number"] {
      width: 64px;
      height: 34px;
      border: 1px solid #d7dadd;
      border-radius: 0;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      background: #fff;
      -moz-appearance: textfield;
    }
    .playing-form .field input[type="number"]::-webkit-inner-spin-button,
    .playing-form .field input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .playing-form .field .hint {
      font-size: 11px;
      color: #929aa1;
      font-weight: 600;
    }

    /* 결과 카드 */
    .playing-result {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .result-card {
      border: 1px solid #e4e6e7;
      background: #fff;
      padding: 16px 18px;
    }
    .result-card .label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #929aa1;
      margin-bottom: 4px;
    }
    .result-card .value {
      font-size: 24px;
      font-weight: 850;
      color: #2d3338;
    }
    .result-card .value small {
      font-size: 14px;
      font-weight: 600;
      color: #8a9198;
      margin-left: 6px;
    }
    .result-card .sub {
      font-size: 11px;
      color: #7a838b;
      margin-top: 2px;
    }
    .result-card.highlight {
      border-color: #d6a76a;
      background: #fffaf0;
    }
    .result-card.highlight .value {
      color: #8a5b1e;
    }

    /* 상세 내역 */
    .detail-list {
      border-top: 1px solid #eceeef;
      padding-top: 16px;
      margin-top: 4px;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid #f2f3f4;
    }
    .detail-item .d-label {
      color: #5e6770;
    }
    .detail-item .d-value {
      font-weight: 700;
      color: #2d3338;
    }
    .detail-item .d-note {
      color: #8a9198;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    /* 새싹비빔밥 포함 표시 */
    .badge-include {
      display: inline-block;
      background: #fff4e6;
      border: 1px solid #e8dcc5;
      color: #8a6b3e;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 8px;
      margin-left: 6px;
      letter-spacing: -.01em;
    }

    /* ===== 반응형 ===== */
    @media (max-width: 760px) {
      .quick-nav {
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        gap: 6px;
      }
      .quick-nav-btn.breakfast-reader {
        min-width: 126px;
        height: 40px;
        padding: 0 13px;
        font-size: 11px;
      }
      .breakfast-modal {
        padding: 7px;
      }
      .breakfast-dialog {
        width: 100%;
        height: 96vh;
        border-radius: 16px;
      }
      .breakfast-modal-head {
        padding: 10px 10px 10px 13px;
      }
      .breakfast-modal-title small {
        display: none;
      }
      .breakfast-modal-body {
        padding: 16px 14px 24px;
      }
      .playing-form {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 8px;
      }
      .playing-form .field {
        flex-wrap: wrap;
      }
      .playing-form .field label {
        min-width: 70px;
        font-size: 12px;
      }
      .playing-result {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .result-card .value {
        font-size: 20px;
      }
    }
    @media (max-width: 480px) {
      .playing-result {
        grid-template-columns: 1fr;
      }
    }

    /* 인쇄 시 숨김 */
    @media print {
      .quick-nav,
      .breakfast-modal {
        display: none !important;
      }
    }

    /* body 잠금 */
    body.breakfast-lock {
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- ===== 하단 고정 버튼 ===== -->
  <div class="quick-nav">
    <button class="quick-nav-btn breakfast-reader" type="button" data-breakfast-open>
      <span class="breakfast-reader-icon">🍴</span>
      <span>조식 리딩연습</span>
    </button>
  </div>

  <!-- ===== 조식 리딩연습 모달 ===== -->
  <div class="breakfast-modal" id="breakfastModal">
    <div class="breakfast-dialog">

      <!-- 헤더 -->
      <div class="breakfast-modal-head">
        <div class="breakfast-modal-title">
          <span class="breakfast-modal-badge">🍴</span>
          <div>
            <b>조식 리딩연습 · 플레이팅 카운트</b>
            <small>메뉴 수량을 입력하면 필요한 기물·반찬 수를 자동 계산</small>
          </div>
        </div>
        <button class="breakfast-close" type="button" data-breakfast-close>✕</button>
      </div>

      <!-- 본문 -->
      <div class="breakfast-modal-body">

        <div class="playing-wrap">

          <!-- ===== 입력 폼 ===== -->
          <div class="playing-form">
            <div class="field">
              <label>🥗 샐러드</label>
              <input type="number" id="saladCount" value="0" min="0" data-calc>
              <span class="hint">개</span>
            </div>
            <div class="field">
              <label>🥄 스프그릇</label>
              <input type="number" id="soupCount" value="0" min="0" data-calc>
              <span class="hint">개</span>
            </div>
            <div class="field">
              <label>🍚 톳밥</label>
              <input type="number" id="riceCount" value="0" min="0" data-calc>
              <span class="hint">개</span>
            </div>
            <div class="field">
              <label>🥣 죽</label>
              <input type="number" id="porridgeCount" value="0" min="0" data-calc>
              <span class="hint">개</span>
            </div>
            <div class="field" style="grid-column: 1 / -1; border-top: 1px solid #e4e6e7; padding-top: 10px; margin-top: 2px;">
              <label>🌱 새싹비빔밥</label>
              <input type="number" id="sproutCount" value="0" min="0" data-calc>
              <span class="hint">개 (포함 시 반찬·동치미 수에 반영)</span>
            </div>
          </div>

          <!-- ===== 결과 카드 ===== -->
          <div class="playing-result" id="resultCards">
            <div class="result-card">
              <div class="label">🥗 샐러드 총 갯수</div>
              <div class="value" id="rSalad">0</div>
            </div>
            <div class="result-card">
              <div class="label">🥄 스프그릇</div>
              <div class="value" id="rSoup">0</div>
            </div>
            <div class="result-card">
              <div class="label">🧂 샐러드소스</div>
              <div class="value" id="rSaladSauce">0</div>
              <div class="sub">샐러드 갯수와 동일</div>
            </div>
            <div class="result-card">
              <div class="label">🧂 톳밥소스</div>
              <div class="value" id="rRiceSauce">0</div>
              <div class="sub">톳밥 갯수와 동일</div>
            </div>
            <div class="result-card highlight">
              <div class="label">🥣 동치미 갯수</div>
              <div class="value" id="rKimchi">0</div>
              <div class="sub">죽 갯수와 동일 <span id="kimchiNote"></span></div>
            </div>
            <div class="result-card highlight">
              <div class="label">🍽️ 반찬 총 갯수</div>
              <div class="value" id="rBanchan">0</div>
              <div class="sub">톳밥 + 죽 <span id="banchanNote"></span></div>
            </div>
          </div>

          <!-- ===== 상세 내역 ===== -->
          <div class="detail-list" id="detailList">
            <div class="detail-item">
              <span class="d-label">📋 소시통 총</span>
              <span class="d-value" id="dSosi">0</span>
            </div>
            <div class="detail-item">
              <span class="d-label">① 샐러드소스</span>
              <span class="d-value" id="dSaladSauceDetail">0</span>
              <span class="d-note">= 샐러드갯수</span>
            </div>
            <div class="detail-item">
              <span class="d-label">② 톳밥소스</span>
              <span class="d-value" id="dRiceSauceDetail">0</span>
              <span class="d-note">= 톳밥갯수</span>
            </div>
            <div class="detail-item">
              <span class="d-label">🥣 동치미</span>
              <span class="d-value" id="dKimchiDetail">0</span>
              <span class="d-note">= 죽갯수</span>
            </div>
            <div class="detail-item">
              <span class="d-label">🍽️ 반찬</span>
              <span class="d-value" id="dBanchanDetail">0</span>
              <span class="d-note">= 톳밥 + 죽</span>
            </div>
            <div class="detail-item" style="border-bottom: 0; padding-top: 10px; margin-top: 4px; border-top: 2px solid #e4e6e7;">
              <span class="d-label">🌱 새싹비빔밥</span>
              <span class="d-value" id="dSprout">0</span>
              <span class="d-note" id="sproutNote">개</span>
            </div>
          </div>

        </div>

      </div>
      <!-- /본문 -->

    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script>
    (function() {
      'use strict';

      // DOM 요소
      const modal = document.getElementById('breakfastModal');
      const openBtn = document.querySelector('[data-breakfast-open]');
      const closeBtn = document.querySelector('[data-breakfast-close]');

      // 입력 필드
      const inputs = {
        salad: document.getElementById('saladCount'),
        soup: document.getElementById('soupCount'),
        rice: document.getElementById('riceCount'),
        porridge: document.getElementById('porridgeCount'),
        sprout: document.getElementById('sproutCount'),
      };

      // 결과 표시 요소
      const r = {
        salad: document.getElementById('rSalad'),
        soup: document.getElementById('rSoup'),
        saladSauce: document.getElementById('rSaladSauce'),
        riceSauce: document.getElementById('rRiceSauce'),
        kimchi: document.getElementById('rKimchi'),
        banchan: document.getElementById('rBanchan'),
        kimchiNote: document.getElementById('kimchiNote'),
        banchanNote: document.getElementById('banchanNote'),
      };

      const d = {
        sosi: document.getElementById('dSosi'),
        saladSauce: document.getElementById('dSaladSauceDetail'),
        riceSauce: document.getElementById('dRiceSauceDetail'),
        kimchi: document.getElementById('dKimchiDetail'),
        banchan: document.getElementById('dBanchanDetail'),
        sprout: document.getElementById('dSprout'),
        sproutNote: document.getElementById('sproutNote'),
      };

      // ===== 계산 함수 =====
      function calc() {
        // 값 읽기 (숫자로 변환, NaN은 0)
        const salad = parseInt(inputs.salad.value) || 0;
        const soup = parseInt(inputs.soup.value) || 0;
        const rice = parseInt(inputs.rice.value) || 0;
        const porridge = parseInt(inputs.porridge.value) || 0;
        const sprout = parseInt(inputs.sprout.value) || 0;

        // 새싹비빔밥 포함 여부 (0보다 크면 포함)
        const hasSprout = sprout > 0;

        // --- 기본 계산 ---
        // 샐러드 총 갯수 = 입력값 그대로
        const totalSalad = salad;

        // 스프그릇 = 입력값 그대로
        const totalSoup = soup;

        // 샐러드소스 = 샐러드 갯수
        const saladSauce = salad;

        // 톳밥소스 = 톳밥 갯수
        const riceSauce = rice;

        // 동치미 = 죽 갯수 (+ 새싹비빔밥 포함 시 추가)
        let kimchi = porridge;
        if (hasSprout) kimchi += sprout;

        // 반찬 = 톳밥 + 죽 (+ 새싹비빔밥 포함 시 추가)
        let banchan = rice + porridge;
        if (hasSprout) banchan += sprout;

        // 소시통 = 샐러드소스 + 톳밥소스 (1번 + 2번)
        const sosi = saladSauce + riceSauce;

        // --- 결과 표시 ---
        // 카드
        r.salad.textContent = totalSalad;
        r.soup.textContent = totalSoup;
        r.saladSauce.textContent = saladSauce;
        r.riceSauce.textContent = riceSauce;
        r.kimchi.textContent = kimchi;
        r.banchan.textContent = banchan;

        // 동치미 노트
        r.kimchiNote.textContent = hasSprout ? `(+ 새싹비빔밥 ${sprout}개 포함)` : '';

        // 반찬 노트
        r.banchanNote.textContent = hasSprout ? `(+ 새싹비빔밥 ${sprout}개 포함)` : '';

        // 상세 내역
        d.sosi.textContent = sosi;
        d.saladSauce.textContent = saladSauce;
        d.riceSauce.textContent = riceSauce;
        d.kimchi.textContent = kimchi;
        d.banchan.textContent = banchan;
        d.sprout.textContent = sprout;
        d.sproutNote.textContent = hasSprout ? `개 (반찬·동치미에 포함됨)` : '개';
      }

      // ===== 이벤트 바인딩 =====
      // 입력 변경 시 자동 계산
      document.querySelectorAll('[data-calc]').forEach(function(el) {
        el.addEventListener('input', calc);
        el.addEventListener('change', calc);
      });

      // 모달 열기
      openBtn.addEventListener('click', function() {
        modal.classList.add('is-open');
        document.body.classList.add('breakfast-lock');
        calc(); // 열 때 계산 갱신
      });

      // 모달 닫기
      function closeModal() {
        modal.classList.remove('is-open');
        document.body.classList.remove('breakfast-lock');
      }

      closeBtn.addEventListener('click', closeModal);

      // 배경 클릭 시 닫기
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      // ESC 키로 닫기
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) {
          closeModal();
        }
      });

      // ===== 초기 계산 =====
      calc();

    })();
  </script>

</body>
</html>
